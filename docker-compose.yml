version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: keypulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keypulsedb
      POSTGRES_USER: keypulse
      POSTGRES_PASSWORD: keypulse_secret
    ports:
      - "5432:5432"
    volumes:
      - keypulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keypulse -d keypulsedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: keypulse-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/keypulsedb
      SPRING_DATASOURCE_USERNAME: keypulse
      SPRING_DATASOURCE_PASSWORD: keypulse_secret
      KEYPULSE_CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: keypulse-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"

volumes:
  keypulse_pgdata:
